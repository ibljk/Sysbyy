# ============================================================
# 云端 / 单端口免配置运行 profile
# 特点：H2 嵌入式数据库（无需安装 MySQL）+ 前端由本服务托管（单端口）
# 启动：java -jar lab-equipment-reservation-1.0.0.jar --spring.profiles.active=cloud
# 端口：读取环境变量 PORT，默认 8080（云平台通常注入 PORT）
# 数据：内存库，每次启动自动重建表与演示数据（演示前无需清理）
# ============================================================
server:
  port: ${PORT:8080}

spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL：兼容 MySQL 语法；DATABASE_TO_LOWER：标识符统一小写
    # NON_KEYWORDS=USER：user 表名与 H2 关键字冲突的规避
    url: jdbc:h2:mem:lab_equipment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql
      continue-on-error: false

logging:
  level:
    com.lab.equipment: info
