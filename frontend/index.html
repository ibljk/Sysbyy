<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智云实验设备预约管理系统</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233D7BBE'/%3E%3Cstop offset='1' stop-color='%231C4679'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M21 9.2c-1.5 0-2.8.85-3.4 2.1a3.86 3.86 0 0 0-1.7-.4 3.9 3.9 0 0 0-3.85 3.35A2.85 2.85 0 0 0 10 20.6h11a4.35 4.35 0 0 0 0-8.7c-.03 0-.06 0-.1.01A2.1 2.1 0 0 0 21 9.2z' fill='none' stroke='white' stroke-width='1.9' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.1' fill='white'/%3E%3C/svg%3E">
    <!-- Element Plus 样式（本地库，离线可用） -->
    <link rel="stylesheet" href="lib/element-plus.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Vue 挂载点（内容由下方 #app-template 模板渲染） -->
<div id="app" v-cloak></div>

<template id="app-template">
    <!-- 登录 / 注册 页面（无侧边栏） -->
    <div v-if="!user">
        <component :is="currentView" v-if="currentView"/>
    </div>

    <!-- 主布局 -->
    <el-container v-else class="layout">
        <el-aside width="228px" class="aside">
            <div class="logo">
                <span class="logo-mark">
                    <el-icon :size="17"><component :is="'Cloudy'"/></el-icon>
                </span>
                <span class="logo-text">
                    <span class="logo-name">智云实验设备预约</span>
                    <span class="logo-sub">ZHIYUN LAB</span>
                </span>
            </div>
            <el-menu :default-active="activeMenu" class="menu" @select="onMenuSelect">
                <template v-for="item in menus" :key="item.path">
                    <el-menu-item :index="item.path">
                        <el-icon><component :is="item.icon"/></el-icon>
                        <span>{{ item.title }}</span>
                    </el-menu-item>
                </template>
            </el-menu>
        </el-aside>

        <el-container>
            <el-header class="header">
                <div>
                    <span class="header-title">{{ pageTitle }}</span>
                    <span class="header-crumb">{{ ROLE_MAP[user.role] || user.role }}工作台</span>
                </div>
                <div class="header-right">
                    <el-dropdown @command="onHeaderCommand">
                        <span class="user-badge">
                            <el-avatar :size="30">
                                {{ (user.realName || user.username).charAt(0) }}
                            </el-avatar>
                            <span class="user-name">{{ user.realName || user.username }}</span>
                            <span class="user-role">{{ ROLE_MAP[user.role] || user.role }}</span>
                            <el-icon :size="13"><component :is="'ArrowDown'"/></el-icon>
                        </span>
                        <template #dropdown>
                            <el-dropdown-menu>
                                <el-dropdown-item command="password">修改密码</el-dropdown-item>
                                <el-dropdown-item command="logout" divided>退出登录</el-dropdown-item>
                            </el-dropdown-menu>
                        </template>
                    </el-dropdown>
                </div>
            </el-header>

            <el-main class="main">
                <component :is="currentView"/>
            </el-main>
        </el-container>
    </el-container>

    <!-- 修改密码对话框 -->
    <el-dialog v-model="pwdDialogVisible" title="修改密码" width="420px" :close-on-click-modal="false">
        <el-form ref="pwdFormRef" :model="pwdForm" :rules="pwdRules" label-width="90px">
            <el-form-item label="原密码" prop="oldPassword">
                <el-input v-model="pwdForm.oldPassword" type="password" show-password/>
            </el-form-item>
            <el-form-item label="新密码" prop="newPassword">
                <el-input v-model="pwdForm.newPassword" type="password" show-password/>
            </el-form-item>
            <el-form-item label="确认密码" prop="confirm">
                <el-input v-model="pwdForm.confirm" type="password" show-password/>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="pwdDialogVisible = false">取消</el-button>
            <el-button type="primary" :loading="pwdLoading" @click="submitPassword">确定</el-button>
        </template>
    </el-dialog>
</template>

<!-- 第三方库（本地 lib/ 目录，完全离线可用） -->
<script src="lib/vue.global.prod.js"></script>
<script src="lib/element-plus.full.js"></script>
<script src="lib/element-plus-zh-cn.js"></script>
<script src="lib/icons-vue.iife.js"></script>
<script src="lib/axios.min.js"></script>
<script src="lib/echarts.min.js"></script>

<!-- 业务代码 -->
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/views/auth.js"></script>
<script src="js/views/dashboard.js"></script>
<!-- 公告与维护报修：先加载（提供 ANNOUNCE_LEVEL_MAP / MAINT_* 常量给其他视图复用） -->
<script src="js/views/announcement.js"></script>
<script src="js/views/maintenance.js"></script>
<script src="js/views/equipment.js"></script>
<script src="js/views/equipment-book.js"></script>
<script src="js/views/labs.js"></script>
<script src="js/views/reservations.js"></script>
<script src="js/views/approval.js"></script>
<script src="js/views/users.js"></script>
<script src="js/views/qualification.js"></script>
<script src="js/views/logs.js"></script>
<script src="js/views/repair.js"></script>
<script src="js/views/notices.js"></script>
<script src="js/views/system.js"></script>
<script src="js/app.js"></script>
</body>
</html>
